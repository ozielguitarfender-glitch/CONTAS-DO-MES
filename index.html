<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Contas">
<link rel="manifest" href="manifest.json"><title>Contas do Mês</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;background:#f5f5f5;color:#171717}
.app{max-width:760px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
h1{font-size:28px;margin:0 0 4px}.sub{color:#6b6b6b;margin-bottom:18px}.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
button,input,select{font:inherit}button{min-height:44px;border:0;border-radius:12px;padding:0 14px;font-weight:700;cursor:pointer}.tab{background:#e9e9e9}.tab.active{background:#171717;color:#fff}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card{background:#fff;border-radius:16px;padding:14px;border:1px solid #e4e4e4}.label{font-size:12px;color:#737373}.num{font-size:20px;font-weight:800;margin-top:4px}
.monthrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 10px}.monthrow input{padding:10px;border:1px solid #ddd;border-radius:10px;background:#fff}
.add{width:100%;background:#171717;color:#fff;margin:8px 0 14px}.form{background:#fff;border:1px solid #e2e2e2;border-radius:16px;padding:14px;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600}.field input,.field select{height:44px;border:1px solid #ddd;border-radius:10px;padding:0 10px;background:#fff}.actions{display:flex;gap:8px;margin-top:12px}.save{background:#171717;color:#fff;flex:1}.cancel{background:#eee;flex:1}
.section{margin-top:16px}.section h2{font-size:16px;margin:0 0 8px}.account{background:#fff;border:1px solid #e2e2e2;border-radius:15px;padding:13px;margin-bottom:8px;display:flex;justify-content:space-between;gap:12px;align-items:center}.name{font-weight:750}.meta{font-size:12px;color:#737373;margin-top:3px}.right{text-align:right;min-width:130px}.value{font-weight:800}.status{display:inline-block;font-size:11px;font-weight:800;padding:4px 7px;border-radius:999px;margin-top:5px}.pago{background:#dcfce7;color:#166534}.pendente{background:#fef3c7;color:#92400e}.atrasado{background:#fee2e2;color:#991b1b}.smallbtn{margin-top:7px;background:#eee;font-size:12px;min-height:36px}.delete{background:#fff0f0;color:#a00;margin-left:4px}.empty{text-align:center;color:#777;padding:28px 8px}.hidden{display:none!important}.toast{position:fixed;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));background:#171717;color:#fff;padding:13px;border-radius:12px;text-align:center;display:none}
@media(max-width:520px){.grid{grid-template-columns:1fr}.right{min-width:115px}.account{align-items:flex-start}.cards{grid-template-columns:1fr 1fr}.num{font-size:18px}}
</style></head><body><main class="app">
<h1>Contas do Mês</h1><div class="sub">Controle o que precisa pagar — sem lançar entradas.</div>
<div class="tabs"><button class="tab active" data-view="geral">📊 Geral</button><button class="tab" data-view="casa">🏠 Casa</button><button class="tab" data-view="barbearia">💈 Barbearia</button></div>
<div class="cards">
<div class="card"><div class="label">Total do mês</div><div class="num" id="total">R$ 0,00</div></div>
<div class="card"><div class="label">Já pago</div><div class="num" id="paid">R$ 0,00</div></div>
<div class="card"><div class="label">A pagar</div><div class="num" id="pending">R$ 0,00</div></div>
<div class="card"><div class="label">Atrasado</div><div class="num" id="late">R$ 0,00</div></div>
</div>
<div class="monthrow"><strong id="viewTitle">Todas as contas</strong><input id="month" type="month"></div>
<button class="add" id="add">+ Adicionar conta</button>
<div class="form hidden" id="form"><form id="frm">
<div class="grid">
<label class="field">Descrição<input id="desc" required maxlength="70" placeholder="Ex.: Aluguel"></label>
<label class="field">Valor<input id="value" required type="number" min=".01" step=".01" inputmode="decimal" placeholder="0,00"></label>
<label class="field">Vencimento<input id="date" required type="date"></label>
<label class="field">Tipo<select id="type"><option value="casa">🏠 Casa</option><option value="barbearia">💈 Barbearia</option></select></label>
<label class="field">Categoria<select id="cat"><option>Aluguel</option><option>Energia</option><option>Água</option><option>Internet</option><option>Mercado</option><option>Cartão</option><option>Fornecedor</option><option>Produtos</option><option>Impostos</option><option>Outros</option></select></label>
</div><div class="actions"><button class="cancel" type="button" id="cancel">Cancelar</button><button class="save" type="submit">Salvar conta</button></div>
</form></div>
<div id="list"></div><div class="toast" id="toast"></div>
</main>
<script>
const KEY="contas_mes_v1"; let accounts=JSON.parse(localStorage.getItem(KEY)||"[]"), view="geral";
const $=id=>document.getElementById(id), money=v=>Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const pad=n=>String(n).padStart(2,"0"), today=new Date(), iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
$("month").value=today.getFullYear()+"-"+pad(today.getMonth()+1);
function save(){localStorage.setItem(KEY,JSON.stringify(accounts))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmt(d){return new Date(d+"T12:00:00").toLocaleDateString("pt-BR")}
function render(){
 const m=$("month").value, arr=accounts.filter(a=>a.date.startsWith(m)&&(view==="geral"||a.type===view));
 let total=0,paid=0,late=0; const now=iso(today);
 arr.forEach(a=>{total+=a.value;if(a.paid)paid+=a.value;else if(a.date<now)late+=a.value});
 $("total").textContent=money(total);$("paid").textContent=money(paid);$("pending").textContent=money(total-paid);$("late").textContent=money(late);
 $("viewTitle").textContent=view==="geral"?"Todas as contas":view==="casa"?"Contas da Casa":"Contas da Barbearia";
 arr.sort((a,b)=>a.date.localeCompare(b.date)); const list=$("list"); list.innerHTML="";
 if(!arr.length){list.innerHTML='<div class="empty">Nenhuma conta cadastrada neste mês.</div>';return}
 const groups=view==="geral"?["casa","barbearia"]:[view];
 groups.forEach(g=>{const items=arr.filter(a=>a.type===g);if(!items.length)return;
 const sec=document.createElement("section");sec.className="section";sec.innerHTML="<h2>"+(g==="casa"?"🏠 Casa":"💈 Barbearia")+"</h2>";
 items.forEach(a=>{const overdue=!a.paid&&a.date<now, el=document.createElement("div");el.className="account";
 el.innerHTML='<div><div class="name">'+esc(a.desc)+'</div><div class="meta">'+fmt(a.date)+" · "+esc(a.cat)+'</div></div><div class="right"><div class="value">'+money(a.value)+'</div><span class="status '+(a.paid?"pago":overdue?"atrasado":"pendente")+'">'+(a.paid?"Pago":overdue?"Atrasado":"Pendente")+'</span><div><button class="smallbtn toggle" data-id="'+a.id+'">'+(a.paid?"Desmarcar pago":"Marcar como pago")+'</button><button class="smallbtn delete" data-del="'+a.id+'">Excluir</button></div></div>';
 sec.appendChild(el)});list.appendChild(sec)});
}
function toast(t){$("toast").textContent=t;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",1800)}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));render()});
$("month").onchange=render;$("add").onclick=()=>{$("form").classList.remove("hidden");$("desc").focus();$("date").value=iso(today)};
$("cancel").onclick=()=>{$("form").classList.add("hidden");$("frm").reset()};
$("frm").onsubmit=e=>{e.preventDefault();const v=Number($("value").value);if(!v||v<=0)return;accounts.push({id:Date.now(),desc:$("desc").value.trim(),value:v,date:$("date").value,type:$("type").value,cat:$("cat").value,paid:false});save();$("frm").reset();$("form").classList.add("hidden");render();toast("Conta adicionada")};
$("list").onclick=e=>{const t=e.target;if(t.dataset.id){const a=accounts.find(x=>x.id==t.dataset.id);if(a){a.paid=!a.paid;save();render();toast(a.paid?"Conta marcada como paga":"Conta voltou para pendente")}}if(t.dataset.del){accounts=accounts.filter(x=>x.id!=t.dataset.del);save();render();toast("Conta excluída")}};
render();
</script></body></html>
